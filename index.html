<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>REVL LOAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #f0f0f0; font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }
    input, button, select { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

// ─── Storage (barbell + plates only) ─────────────────────────────────────────
const STORAGE_KEY = 'revl-equipment-v1';
function loadEquipment() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; } }
function saveEquipment(e) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(e)); } catch {} }
const DEFAULT_EQUIPMENT = { barbellWeight: 20, availablePlates: [20, 15, 10, 5, 2.5, 1.25, 1, 0.5] };

// ─── Plate math ───────────────────────────────────────────────────────────────
function calculatePlates(targetKg, barbellKg, availablePlates) {
  const perSide = (targetKg - barbellKg) / 2;
  if (perSide <= 0) return { plates: [], actualTotal: barbellKg, deficit: 0 };
  const sorted = [...availablePlates].sort((a, b) => b - a);
  let remaining = perSide;
  const plates = [];
  for (const p of sorted) {
    while (remaining >= p - 0.001) { plates.push(p); remaining -= p; remaining = Math.round(remaining * 1000) / 1000; }
  }
  const actualPerSide = perSide - remaining;
  const actualTotal = Math.round((barbellKg + actualPerSide * 2) * 100) / 100;
  return { plates, actualTotal, deficit: Math.round(remaining * 2 * 100) / 100 };
}

// ─── Percentage parsing ───────────────────────────────────────────────────────
function parsePrescription(prescription, oneRM) {
  if (!prescription || !oneRM) return { pcts: [], kgs: [] };
  const nums = (prescription.match(/[\d.]+/g) || []).map(Number);
  if (!nums.length) return { pcts: [], kgs: [] };
  // Expand X-Y range into 5% steps if exactly 2 nums and spread > 10
  let pctList = (nums.length === 2 && nums[1] - nums[0] >= 10)
    ? (() => { const r = []; for (let p = nums[0]; p <= nums[1] + 0.001; p += 5) r.push(Math.round(p * 10) / 10); return r; })()
    : nums;
  const pcts = pctList.map(n => n / 100);
  const kgs = pcts.map(p => Math.round((oneRM * p) / 2.5) * 2.5);
  return { pcts, kgs };
}

// ─── Image compression ────────────────────────────────────────────────────────
function toJpegBase64(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const MAX_DIM = 600;
      let { naturalWidth: w, naturalHeight: h } = img;
      if (w > MAX_DIM || h > MAX_DIM) {
        if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
        else { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const TARGET = 400_000;
      for (let q = 0.7; q >= 0.2; q -= 0.1) {
        const b64 = canvas.toDataURL('image/jpeg', q).split(',')[1];
        if (b64.length < TARGET || q <= 0.21) { resolve(b64); return; }
      }
    };
    img.onerror = () => reject(new Error('Failed to load image'));
    img.src = dataUrl;
  });
}

// ─── Step 1 API: read exercises + prescriptions only, no kg calculation ───────
async function readWorkout(imageDataUrl) {
  const finalBase64 = await toJpegBase64(imageDataUrl);
  const systemPrompt = `You are a strength training assistant reading a REVL gym workout screen.

ONLY extract exercises with an explicit percentage-based weight prescription (e.g. "@ 75%", "50-70%", "60-70-75-85-90-92.5%").
Ignore all other exercises entirely.

For each qualifying exercise return:
- name: standardized exercise name (e.g. "Back Squat", "Bench Press")
- type: "barbell" | "dumbbell" | "kettlebell"
- prescription: the percentage string exactly as written (e.g. "50-70%" or "75%")
- sets: sets if visible
- reps: reps if visible

Do NOT calculate any weights — the user will provide their 1RM separately.

Respond ONLY with valid JSON, no markdown:
{"exercises":[{"name":"Bench Press","type":"barbell","prescription":"50-70%","sets":"6","reps":"varies"}],"workoutNotes":"brief one-line session summary"}`;

  const response = await fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 600,
      system: systemPrompt,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: finalBase64 } },
        { type: 'text', text: 'Extract percentage-based exercises only. Return JSON.' }
      ]}]
    })
  });
  const rawText = await response.text();
  let data;
  try { data = JSON.parse(rawText); } catch { throw new Error(`Server error ${response.status}: ${rawText.slice(0, 200)}`); }
  if (!response.ok || data.error) throw new Error(`API error: ${data.error?.message || JSON.stringify(data).slice(0, 200)}`);
  const text = data.content?.find(b => b.type === 'text')?.text || '{}';
  const clean = text.replace(/```json|```/g, '').trim();
  try { return JSON.parse(clean); } catch { throw new Error(`Could not parse response: ${clean.slice(0, 200)}`); }
}

// ─── Styles ───────────────────────────────────────────────────────────────────
const S = {
  label: { display: 'block', fontSize: 11, color: '#888', letterSpacing: 1, marginBottom: 4, marginTop: 14 },
  input: { width: '100%', padding: '10px 12px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 8, color: '#f0f0f0', fontSize: 14, marginBottom: 4, outline: 'none' },
};

// ─── PlateViz ─────────────────────────────────────────────────────────────────
function PlateViz({ plates }) {
  const COLORS = { 20: '#c0392b', 15: '#2980b9', 10: '#27ae60', 5: '#f39c12', 2.5: '#8e44ad', 1.25: '#7f8c8d', 1: '#bdc3c7', 0.5: '#ecf0f1' };
  const HEIGHTS = { 20: 80, 15: 68, 10: 56, 5: 44, 2.5: 34, 1.25: 26, 1: 22, 0.5: 18 };
  if (!plates.length) return null;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 3, marginTop: 8 }}>
      <div style={{ width: 40, height: 12, background: '#888', borderRadius: 2, flexShrink: 0 }} />
      {plates.map((p, i) => (
        <div key={i} style={{ width: 16, height: HEIGHTS[p] || 24, background: COLORS[p] || '#555', borderRadius: 3, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 8, color: 'white', fontWeight: 700, flexShrink: 0, writingMode: 'vertical-lr' }}>{p}</div>
      ))}
      <div style={{ width: 20, height: 12, background: '#888', borderRadius: 2, flexShrink: 0 }} />
    </div>
  );
}

// ─── EditableValue ────────────────────────────────────────────────────────────
function EditableValue({ value, onChange, color, suffix, fontSize }) {
  const [editing, setEditing] = useState(false);
  const [inputVal, setInputVal] = useState(String(value));
  useEffect(() => { if (!editing) setInputVal(String(value)); }, [value, editing]);
  const commit = () => {
    const parsed = parseFloat(inputVal);
    if (!isNaN(parsed) && parsed > 0) onChange(parsed);
    else setInputVal(String(value));
    setEditing(false);
  };
  if (editing) return (
    <input autoFocus type="number" value={inputVal}
      onChange={e => setInputVal(e.target.value)}
      onBlur={commit}
      onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setInputVal(String(value)); setEditing(false); } }}
      style={{ width: 72, padding: '2px 6px', background: `rgba(${color === '#00d4aa' ? '0,212,170' : '230,183,0'},0.12)`, border: `1px solid ${color}`, borderRadius: 6, color, fontSize: fontSize || 16, fontWeight: 700, fontFamily: "'Barlow Condensed', sans-serif", textAlign: 'center', outline: 'none' }}
    />
  );
  return (
    <span onClick={() => { setInputVal(String(value)); setEditing(true); }}
      style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: fontSize || 16, fontWeight: 700, color, cursor: 'text', borderBottom: `1px dashed ${color}88`, paddingBottom: 1 }}>
      {value}{suffix}
    </span>
  );
}

// ─── PlateRow ─────────────────────────────────────────────────────────────────
function PlateRow({ label, kg, pct, barbellKg, availablePlates, onKgChange, onOneRMChange }) {
  const pd = calculatePlates(kg, barbellKg, availablePlates);
  const nudge = delta => {
    const snapped = Math.round(kg / 2.5) * 2.5;
    const next = delta > 0 ? snapped + 2.5 : snapped - 2.5;
    onKgChange(Math.max(0, next));
  };
  const impliedRM = pct > 0 ? Math.round(kg / pct * 10) / 10 : null;
  return (
    <div style={{ marginBottom: 12, paddingBottom: 12, borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 12, color: '#888', minWidth: 56 }}>{label}</span>
        {pct > 0 && <span style={{ fontSize: 11, color: '#aaa', background: 'rgba(255,255,255,0.07)', borderRadius: 4, padding: '2px 7px', fontWeight: 700 }}>{Math.round(pct * 100)}%</span>}
        {impliedRM !== null && (
          <span style={{ fontSize: 11, color: '#666', display: 'flex', alignItems: 'center', gap: 4 }}>
            implied 1RM: <EditableValue value={impliedRM} onChange={onOneRMChange} color="#e6b700" suffix="kg" fontSize={13} />
          </span>
        )}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
        <button onClick={() => nudge(-2.5)} style={{ width: 32, height: 32, background: 'rgba(255,255,255,0.07)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 7, color: '#ccc', cursor: 'pointer', fontSize: 18, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>−</button>
        <EditableValue value={kg} onChange={onKgChange} color="#00d4aa" suffix="kg" fontSize={22} />
        <button onClick={() => nudge(2.5)} style={{ width: 32, height: 32, background: 'rgba(255,255,255,0.07)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 7, color: '#ccc', cursor: 'pointer', fontSize: 18, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>+</button>
      </div>
      {pd.plates.length > 0 ? (
        <>
          <div style={{ fontSize: 11, color: '#888' }}>
            Per side: <span style={{ color: '#00d4aa', fontWeight: 700 }}>{pd.plates.join(' + ')} kg</span>
            {pd.deficit > 0 && <span style={{ color: '#e74c3c', marginLeft: 6 }}>(closest: {pd.actualTotal}kg)</span>}
          </div>
          <PlateViz plates={pd.plates} />
          <div style={{ fontSize: 10, color: '#555', marginTop: 4 }}>Bar {barbellKg}kg + {pd.plates.reduce((a, b) => a + b, 0) * 2}kg = {pd.actualTotal}kg</div>
        </>
      ) : <div style={{ fontSize: 11, color: '#666' }}>Bar only ({barbellKg}kg)</div>}
    </div>
  );
}

// ─── ExerciseCard ─────────────────────────────────────────────────────────────
function ExerciseCard({ ex, oneRM, barbellKg, availablePlates }) {
  const [expanded, setExpanded] = useState(true);
  const { pcts, kgs: initKgs } = parsePrescription(ex.prescription, oneRM);
  const [waveKgs, setWaveKgs] = useState(initKgs);
  const isWave = waveKgs.length > 1;

  const updateWaveKg = (i, val) => setWaveKgs(prev => prev.map((k, idx) => idx === i ? val : k));
  const updateOneRM = (i, newRM) => {
    const pct = pcts[i];
    if (pct > 0) updateWaveKg(i, Math.round((newRM * pct) / 2.5) * 2.5);
  };

  return (
    <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 12, padding: '16px 20px', marginBottom: 12 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 22, fontWeight: 700, letterSpacing: 1 }}>{ex.name.toUpperCase()}</div>
          <div style={{ fontSize: 13, color: '#888', marginTop: 2 }}>
            {[ex.sets && `${ex.sets} sets`, ex.reps && `${ex.reps} reps`].filter(Boolean).join(' × ')}
            {ex.prescription && <span style={{ marginLeft: 8, color: '#e67e22', fontWeight: 600 }}>@ {ex.prescription}</span>}
          </div>
        </div>
        <div style={{ textAlign: 'right', marginLeft: 12 }}>
          {isWave
            ? <><div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 13, fontWeight: 700, color: '#00d4aa', lineHeight: 1.4 }}>{waveKgs.join(' → ')}</div><div style={{ fontSize: 11, color: '#888' }}>kg</div></>
            : <><div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 36, fontWeight: 800, color: '#00d4aa', lineHeight: 1 }}>{waveKgs[0]}</div><div style={{ fontSize: 12, color: '#888' }}>kg</div></>
          }
        </div>
      </div>
      <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid rgba(255,255,255,0.07)' }}>
        {isWave ? (
          <>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, cursor: 'pointer' }} onClick={() => setExpanded(e => !e)}>
              <span style={{ fontSize: 11, color: '#888', letterSpacing: 1 }}>PLATE LOADING PER ROUND</span>
              <span style={{ fontSize: 12, color: '#00d4aa' }}>{expanded ? '▲ hide' : '▼ show'}</span>
            </div>
            {expanded && waveKgs.map((kg, i) => (
              <PlateRow key={i} label={`Round ${i + 1}`} kg={kg} pct={pcts[i] || 0} barbellKg={barbellKg} availablePlates={availablePlates} onKgChange={v => updateWaveKg(i, v)} onOneRMChange={v => updateOneRM(i, v)} />
            ))}
          </>
        ) : (
          <PlateRow label="Load" kg={waveKgs[0]} pct={pcts[0] || 0} barbellKg={barbellKg} availablePlates={availablePlates} onKgChange={v => updateWaveKg(0, v)} onOneRMChange={v => updateOneRM(0, v)} />
        )}
      </div>
    </div>
  );
}

// ─── 1RM + Bar Input Form ─────────────────────────────────────────────────────
function OneRMForm({ exercises, savedRMs, savedEquipment, onSubmit }) {
  const lifts = [...new Set(exercises.map(e => e.name))];
  const [values, setValues] = useState(() => {
    const init = {};
    lifts.forEach(l => { init[l] = savedRMs[l] || ''; });
    return init;
  });
  const [barbellWeight, setBarbellWeight] = useState(savedEquipment.barbellWeight);
  const [showPlates, setShowPlates] = useState(false);
  const [plates, setPlates] = useState(savedEquipment.availablePlates);
  const [newPlate, setNewPlate] = useState('');

  const addPlate = () => {
    const v = parseFloat(newPlate);
    if (!isNaN(v) && v > 0 && !plates.includes(v)) { setPlates(p => [...p, v]); setNewPlate(''); }
  };

  return (
    <div style={{ background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 12, padding: '20px', marginTop: 16 }}>
      <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 18, fontWeight: 700, letterSpacing: 1, marginBottom: 4 }}>YOUR DETAILS</div>
      <div style={{ fontSize: 13, color: '#666', marginBottom: 20 }}>1RM and bar for this workout</div>

      {/* 1RM fields */}
      {lifts.map(lift => (
        <div key={lift} style={{ marginBottom: 14 }}>
          <label style={{ display: 'block', fontSize: 12, color: '#aaa', marginBottom: 5 }}>{lift.toUpperCase()} — 1RM</label>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <input type="number" placeholder="kg" value={values[lift]}
              onChange={e => setValues(v => ({ ...v, [lift]: e.target.value }))}
              style={{ ...S.input, margin: 0, flex: 1, fontSize: 20, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700 }} />
            <span style={{ color: '#666', fontSize: 14, minWidth: 20 }}>kg</span>
          </div>
        </div>
      ))}

      {/* Divider */}
      <div style={{ borderTop: '1px solid rgba(255,255,255,0.07)', margin: '20px 0' }} />

      {/* Bar weight */}
      <div style={{ marginBottom: 14 }}>
        <label style={{ display: 'block', fontSize: 12, color: '#aaa', marginBottom: 5 }}>BARBELL WEIGHT</label>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <input type="number" value={barbellWeight} onChange={e => setBarbellWeight(parseFloat(e.target.value) || 20)}
            style={{ ...S.input, margin: 0, flex: 1, fontSize: 20, fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700 }} />
          <span style={{ color: '#666', fontSize: 14, minWidth: 20 }}>kg</span>
        </div>
      </div>

      {/* Plates — collapsed by default */}
      <div onClick={() => setShowPlates(s => !s)} style={{ cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: showPlates ? 10 : 0 }}>
        <label style={{ fontSize: 12, color: '#aaa', cursor: 'pointer' }}>AVAILABLE PLATES</label>
        <span style={{ fontSize: 12, color: '#00d4aa' }}>{showPlates ? '▲ hide' : '▼ edit'}</span>
      </div>
      {!showPlates && (
        <div style={{ fontSize: 12, color: '#555', marginBottom: 4 }}>{[...plates].sort((a,b) => b-a).join(', ')}kg</div>
      )}
      {showPlates && (
        <>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 8 }}>
            {[...plates].sort((a, b) => b - a).map(p => (
              <div key={p} style={{ display: 'flex', alignItems: 'center', gap: 4, background: 'rgba(0,212,170,0.08)', border: '1px solid rgba(0,212,170,0.3)', borderRadius: 6, padding: '4px 8px' }}>
                <span style={{ color: '#00d4aa', fontSize: 13, fontWeight: 700 }}>{p}kg</span>
                <button onClick={() => setPlates(prev => prev.filter(x => x !== p))} style={{ background: 'none', border: 'none', color: '#e74c3c', cursor: 'pointer', fontSize: 14, padding: 0 }}>×</button>
              </div>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 4 }}>
            <input type="number" step="0.25" placeholder="e.g. 0.5" value={newPlate} onChange={e => setNewPlate(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') addPlate(); }}
              style={{ ...S.input, margin: 0, flex: 1 }} />
            <button onClick={addPlate} style={{ padding: '10px 14px', background: 'rgba(0,212,170,0.12)', border: '1px solid #00d4aa', borderRadius: 8, color: '#00d4aa', cursor: 'pointer', fontWeight: 700, fontSize: 14 }}>+ Add</button>
          </div>
        </>
      )}

      <button
        onClick={() => {
          const rms = {};
          lifts.forEach(l => { const v = parseFloat(values[l]); if (!isNaN(v) && v > 0) rms[l] = v; });
          if (Object.keys(rms).length < lifts.length) return alert('Please enter all 1RM values');
          onSubmit(rms, { barbellWeight, availablePlates: plates });
        }}
        style={{ marginTop: 20, width: '100%', padding: '14px', background: '#00d4aa', color: '#000', border: 'none', borderRadius: 10, fontWeight: 800, fontFamily: "'Barlow Condensed', sans-serif", fontSize: 18, letterSpacing: 2, cursor: 'pointer' }}
      >
        CALCULATE WEIGHTS
      </button>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [equipment, setEquipment] = useState(() => loadEquipment() || DEFAULT_EQUIPMENT);
  const [imagePreview, setImagePreview] = useState(null);
  const [imageDataUrl, setImageDataUrl] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [phase, setPhase] = useState('idle');
  const [workoutData, setWorkoutData] = useState(null);
  const [oneRMs, setOneRMs] = useState({});
  const [savedRMs, setSavedRMs] = useState(() => { try { return JSON.parse(localStorage.getItem('revl-rms-v1')) || {}; } catch { return {}; } });

  const cameraRef = useRef();
  const galleryRef = useRef();

  const handleImage = useCallback(file => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => { setImagePreview(e.target.result); setImageDataUrl(e.target.result); setPhase('idle'); setWorkoutData(null); setOneRMs({}); setError(null); };
    reader.readAsDataURL(file);
  }, []);

  const handleAnalyze = useCallback(async () => {
    if (!imageDataUrl) return;
    setLoading(true); setError(null);
    try {
      const data = await readWorkout(imageDataUrl);
      if (!data.exercises || data.exercises.length === 0) {
        setError('No percentage-based exercises found in this workout.');
        setLoading(false); return;
      }
      setWorkoutData(data);
      setPhase('enter1rm');
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  }, [imageDataUrl]);

  const handleSubmitRMs = useCallback((rms, newEquipment) => {
    const merged = { ...savedRMs, ...rms };
    setSavedRMs(merged);
    try { localStorage.setItem('revl-rms-v1', JSON.stringify(merged)); } catch {}
    setEquipment(newEquipment);
    saveEquipment(newEquipment);
    setOneRMs(rms);
    setPhase('results');
  }, [savedRMs]);

  const handleReset = useCallback(() => {
    setImagePreview(null); setImageDataUrl(null);
    setPhase('idle'); setWorkoutData(null); setOneRMs({}); setError(null);
  }, []);

  return (
    <div style={{ minHeight: '100vh', background: '#0d0d0d', color: '#f0f0f0', paddingBottom: 60 }}>
      {/* Header */}
      <div style={{ background: 'linear-gradient(135deg,#0d0d0d,#1a1a1a)', borderBottom: '1px solid rgba(255,255,255,0.08)', padding: '20px 20px 16px' }}>
        <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontSize: 28, fontWeight: 800, letterSpacing: 3, color: '#00d4aa' }}>REVL LOAD</div>
        <div style={{ fontSize: 12, color: '#555', letterSpacing: 1 }}>WORKOUT WEIGHT CALCULATOR</div>
      </div>

      <div style={{ padding: '20px 16px', maxWidth: 520, margin: '0 auto' }}>
        {/* Image preview */}
        {imagePreview && (
          <div style={{ border: '2px solid rgba(0,212,170,0.4)', borderRadius: 14, overflow: 'hidden', marginBottom: 12 }}>
            <img src={imagePreview} alt="Workout" style={{ width: '100%', display: 'block' }} />
          </div>
        )}

        {/* Upload zone */}
        {!imagePreview && (
          <div onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); handleImage(e.dataTransfer.files[0]); }}
            style={{ border: '2px dashed rgba(255,255,255,0.1)', borderRadius: 14, padding: '28px 20px 24px', background: 'rgba(255,255,255,0.02)', marginBottom: 12 }}>
            <div style={{ textAlign: 'center', marginBottom: 20 }}>
              <div style={{ fontSize: 36, marginBottom: 8 }}>📋</div>
              <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontSize: 16, color: '#666', letterSpacing: 1 }}>ADD WORKOUT SCREEN</div>
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={() => cameraRef.current?.click()} style={{ flex: 1, padding: '13px 10px', background: 'rgba(0,212,170,0.1)', border: '1px solid rgba(0,212,170,0.35)', borderRadius: 10, color: '#00d4aa', cursor: 'pointer', fontFamily: "'Barlow Condensed',sans-serif", fontSize: 16, fontWeight: 700, letterSpacing: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                <span style={{ fontSize: 20 }}>📸</span> TAKE PHOTO
              </button>
              <button onClick={() => galleryRef.current?.click()} style={{ flex: 1, padding: '13px 10px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 10, color: '#ccc', cursor: 'pointer', fontFamily: "'Barlow Condensed',sans-serif", fontSize: 16, fontWeight: 700, letterSpacing: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                <span style={{ fontSize: 20 }}>🖼️</span> UPLOAD
              </button>
            </div>
          </div>
        )}

        <input ref={cameraRef} type="file" accept="image/*" capture="environment" style={{ display: 'none' }} onChange={e => handleImage(e.target.files[0])} />
        <input ref={galleryRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={e => handleImage(e.target.files[0])} />

        {imagePreview && phase === 'idle' && (
          <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
            <button onClick={handleAnalyze} disabled={loading} style={{ flex: 1, padding: '14px', background: loading ? '#1a4a42' : '#00d4aa', color: loading ? '#00d4aa' : '#000', border: 'none', borderRadius: 10, fontFamily: "'Barlow Condensed',sans-serif", fontSize: 20, fontWeight: 800, letterSpacing: 2, cursor: loading ? 'default' : 'pointer' }}>
              {loading ? 'READING WORKOUT...' : 'READ WORKOUT'}
            </button>
            <button onClick={handleReset} style={{ padding: '14px 16px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 10, color: '#888', cursor: 'pointer', fontSize: 18 }}>✕</button>
          </div>
        )}

        {error && <div style={{ marginTop: 16, padding: 14, background: 'rgba(231,76,60,0.1)', border: '1px solid rgba(231,76,60,0.3)', borderRadius: 10, color: '#e74c3c', fontSize: 13, wordBreak: 'break-word' }}>{error}</div>}

        {phase === 'enter1rm' && workoutData && (
          <>
            {workoutData.workoutNotes && <div style={{ fontSize: 13, color: '#888', marginTop: 16, fontStyle: 'italic', padding: '10px 14px', background: 'rgba(255,255,255,0.03)', borderRadius: 8 }}>{workoutData.workoutNotes}</div>}
            <OneRMForm exercises={workoutData.exercises} savedRMs={savedRMs} savedEquipment={equipment} onSubmit={handleSubmitRMs} />
          </>
        )}

        {phase === 'results' && workoutData && (
          <div style={{ marginTop: 24 }}>
            {workoutData.workoutNotes && <div style={{ fontSize: 13, color: '#888', marginBottom: 16, fontStyle: 'italic', padding: '10px 14px', background: 'rgba(255,255,255,0.03)', borderRadius: 8 }}>{workoutData.workoutNotes}</div>}
            {workoutData.exercises.map((ex, i) => (
              <ExerciseCard key={i} ex={ex} oneRM={oneRMs[ex.name] || 100} barbellKg={equipment.barbellWeight} availablePlates={equipment.availablePlates} />
            ))}
            <button onClick={() => setPhase('enter1rm')} style={{ marginTop: 8, width: '100%', padding: '12px', background: 'transparent', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 10, color: '#888', cursor: 'pointer', fontSize: 14 }}>← Edit details</button>
            <button onClick={handleReset} style={{ marginTop: 8, width: '100%', padding: '12px', background: 'transparent', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 10, color: '#888', cursor: 'pointer', fontSize: 14 }}>New workout</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
